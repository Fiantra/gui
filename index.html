<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    background: linear-gradient(-45deg, #ff4e50, #fc913a, #ff6f91, #ff9671);
    background-size: 400% 400%;
    animation: gradientBG 10s ease infinite;
    text-align: center;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

h1 {
    color: white;
    font-size: 3em;
    text-shadow: 2px 2px 15px rgba(0,0,0,0.3);
    margin-bottom: 40px;
}

.buttons {
    position: relative;
}

button {
    padding: 15px 35px;
    font-size: 1.3em;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s ease;
}

/* YES BUTTON */
#yes {
    background: #ff0055;
    color: white;
    box-shadow: 0 0 25px #ff0055;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
}

/* NO BUTTON */
#no {
    background: white;
    color: #ff0055;
    position: absolute;
}

/* MESSAGE */
#message {
    margin-top: 30px;
    font-size: 2.2em;
    color: white;
    opacity: 0;
    transition: opacity 1s ease;
}

/* MEME IMAGE */
#meme {
    display: none;
    margin-top: 30px;
    width: 80%;
    max-width: 420px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.8s ease;
}

/* FLOATING HEARTS */
.heart {
    position: absolute;
    bottom: -20px;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    color: white;
}

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-100vh); opacity: 0; }
}
</style>
</head>

<body>

<h1>Will you be my Valentine? 💖</h1>

<div class="buttons">
    <button id="yes">Yes 💘</button>
    <button id="no">No 💔</button>
</div>

<div id="message">
    I knew you'd say yes... I love you 🥂❤️
</div>

<img id="meme" src="The-Great-Gatsby-2013.webp" alt="Gatsby Cheers Meme">

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const message = document.getElementById("message");
const meme = document.getElementById("meme");

/* NO button runs away */
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 120);
    const y = Math.random() * (window.innerHeight - 60);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

/* YES click action */
yesBtn.addEventListener("click", () => {

    // show message
    message.style.opacity = 1;

    // show meme with zoom effect
    meme.style.display = "block";
    setTimeout(() => {
        meme.style.opacity = 1;
        meme.style.transform = "scale(1)";
    }, 100);

    // remove buttons
    document.querySelector(".buttons").style.display = "none";
});

/* Floating hearts animation */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
