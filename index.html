<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine</title>
    <style>
        body {
            background-color: #ffe6e6;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }
        h1 {
            color: #ff6699;
            font-size: 3em;
            margin-bottom: 40px;
        }
        .buttons {
            display: flex;
            gap: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        #yes {
            background-color: #ff99cc;
            color: white;
        }
        #no {
            background-color: #cc3366;
            color: white;
        }
        @keyframes blink {
            0%, 50%, 100% {
                opacity: 1;
            }
            25%, 75% {
                opacity: 0.3;
            }
        }
        .blink {
            animation: blink 1s infinite;
        }
        #message {
            margin-top: 50px;
            font-size: 2em;
            color: #ff3366;
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine?</h1>
    <div class="buttons">
        <button id="yes">Yes</button>
        <button id="no">No</button>
    </div>
    <div id="message"></div>

    <script>
        const noButton = document.getElementById('no');
        const yesButton = document.getElementById('yes');
        const message = document.getElementById('message');

        // Make the "No" button move away from the mouse
        noButton.addEventListener('mousemove', function(e) {
            const rect = noButton.getBoundingClientRect();
            const offsetX = e.clientX - rect.left;
            const offsetY = e.clientY - rect.top;
            const midX = rect.width / 2;
            const midY = rect.height / 2;

            // Calculate direction away from mouse
            const dirX = offsetX - midX;
            const dirY = offsetY - midY;

            // Move the button away slightly
            const moveX = dirX * 0.2;
            const moveY = dirY * 0.2;
            noButton.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Make Yes blink
        yesButton.classList.add('blink');

        // Handle the Yes button click
        yesButton.addEventListener('click', function() {
            message.textContent = "Oh, I love you!";
        });

        // Optional: Make "No" button reset if mouse leaves
        noButton.addEventListener('mouseleave', function() {
            noButton.style.transform = 'translate(0, 0)';
        });
    </script>
</body>
</html>
